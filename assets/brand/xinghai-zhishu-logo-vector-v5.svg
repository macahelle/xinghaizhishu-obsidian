<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="星海知枢品牌图形">
  <defs>
    <linearGradient id="xinghai" x1="42" y1="42" x2="214" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22B8F0"/>
    </linearGradient>
  </defs>

  <!-- 开放轨道：知识持续扩展，并为探索保留出口。 -->
  <path
    d="M47 103A84 84 0 0 1 184 61"
    fill="none"
    stroke="url(#xinghai)"
    stroke-width="10"
    stroke-linecap="round"
  />
  <path
    d="M205 104A84 84 0 0 1 66 192"
    fill="none"
    stroke="url(#xinghai)"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- 单一探索坐标，与主轨道形成非对称张力。 -->
  <circle cx="186" cy="62" r="12" fill="url(#xinghai)"/>

  <!-- 中央知识星核；内部菱形负空间代表可进入、可继续展开的知识入口。 -->
  <path
    fill="url(#xinghai)"
    fill-rule="evenodd"
    d="M128 61
       C135 103 153 121 195 128
       C153 135 135 153 128 195
       C121 153 103 135 61 128
       C103 121 121 103 128 61Z
       M128 117L139 128L128 139L117 128Z"
  />
</svg>
